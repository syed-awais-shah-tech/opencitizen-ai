name: OpenCitizen CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Ensure concurrency cancels previous in-flight runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Linting & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///:memory:
      QDRANT_IN_MEMORY: "true"
      GEMINI_API_KEY: "ci-mock-gemini-token-hermetic-testing"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check backend

      - name: Run Backend Unit & Module Tests
        run: |
          pytest backend/tests -v --durations=10

      - name: Run Backend Integration Tests
        run: |
          pytest tests -v

  frontend-checks:
    name: Frontend Linting, Types & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend

      - name: Run TypeScript Typecheck
        run: |
          npm run typecheck --prefix frontend

      - name: Run Next.js Production Build Validation
        run: |
          npm run build --prefix frontend
